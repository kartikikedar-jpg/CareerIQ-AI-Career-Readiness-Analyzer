<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerIQ | Login</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;

    background:
        linear-gradient(rgba(12, 55, 51, 0.65),
                        rgba(12, 55, 51, 0.65)),
        url("/static/images/adypu-campus.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.container {
    width: 420px;
    max-width: 95%;
    padding: 32px;
    background: rgba(255, 253, 245, 0.97);
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(0,0,0,.25);
    text-align: center;
}

.college-logo {
    width: 95px;
    height: 95px;
    object-fit: contain;
    margin-bottom: 10px;
}

.college-name {
    color: #365b53;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 18px;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    color: #176b61;
}

.tagline {
    color: #648078;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    color: #234b45;
    margin-top: 25px;
}

.subtitle {
    color: #777;
    margin-bottom: 28px;
}

.field {
    margin-bottom: 20px;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #365b53;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbdcd4;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #176b61;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 45px;
}

.eye-button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #176b61;
}

.eye-button svg {
    width: 21px;
    height: 21px;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #176b61;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
}

.submit-btn:hover {
    background: #10534b;
}

.error {
    background: #ffe8e5;
    color: #b42318;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
}

.bottom-text {
    margin-top: 22px;
    color: #777;
    font-size: 14px;
}

a {
    color: #176b61;
    font-weight: bold;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.footer {
    margin-top: 22px;
    color: #71847e;
    font-size: 11px;
}

@media(max-width: 480px) {
    .container {
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <img
        src="{{ url_for('static', filename='images/seamedu-logo.png') }}"
        alt="College Logo"
        class="college-logo"
    >

    <div class="college-name">
        AJEENKYA D. Y. PATIL UNIVERSITY
    </div>

    <div class="logo">CareerIQ</div>

    <div class="tagline">
        AI-Powered Career Readiness System
    </div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">Login to your account</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">

        <div class="field">
            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="field">
            <label>Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    onclick="togglePassword()"
                    aria-label="Show password"
                >
                    <svg
                        id="eyeIcon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>

            </div>
        </div>

        <button type="submit" class="submit-btn">
            Login
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="/signup">Sign Up</a>
    </div>

    <div class="footer">
        CareerIQ | College Project
    </div>

</div>

<script>
function togglePassword() {

    const password = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if (password.type === "password") {

        password.type = "text";

        icon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
            <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.7"/>
            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.6-.3 3.7-.8"/>
        `;

    } else {

        password.type = "password";

        icon.innerHTML = `
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        `;
    }
}
</script>

</body>
</html>
