
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerIQ | Signup</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8f2ed;
}

.container {
    width: 400px;
    max-width: 92%;
    padding: 38px;
    background: #fffdf5;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(23,107,97,.15);
}

.logo {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #176b61;
}

h2 { text-align: center; color: #234b45; }

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.field { margin-bottom: 17px; }

label {
    display: block;
    margin-bottom: 7px;
    color: #365b53;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbdcd4;
    border-radius: 8px;
    outline: none;
}

.password-wrapper { position: relative; }

.password-wrapper input { padding-right: 45px; }

.eye-button {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    color: #176b61;
}

.eye-button svg { width: 21px; height: 21px; }

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #176b61;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

.error {
    background: #ffe8e5;
    color: #b42318;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
}

.bottom-text {
    text-align: center;
    margin-top: 22px;
    color: #777;
}

a {
    color: #176b61;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">CareerIQ</div>
    <h2>Create Account</h2>
    <p class="subtitle">Start your career journey</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">

        <div class="field">
            <label>Full Name</label>
            <input type="text" name="name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="field">
            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="field">
            <label>Password</label>

            <div class="password-wrapper">
                <input type="password" name="password"
                       id="password"
                       placeholder="Create password"
                       minlength="8" required>

                <button type="button" class="eye-button"
                        onclick="togglePassword()"
                        aria-label="Show password">

                    <svg id="eyeIcon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                </button>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

    </form>

    <div class="bottom-text">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.innerHTML = `
        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
        <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.7"/>
        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.6-.3 3.7-.8"/>
        `;
    } else {
        password.type = "password";
        icon.innerHTML = `
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
        `;
    }
}
</script>

</body>
</html>
