
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerIQ | Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F4F0E6;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fffaf0;
            padding: 38px;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,.12);
        }
        h1 { color: #0c7a96; margin-bottom: 8px; }
        p { color: #667078; }
        label { display: block; margin: 20px 0 7px; font-weight: bold; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5d8;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: #0c7a96;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #095d73; }
        .error {
            background: #ffe8e5;
            color: #a83225;
            padding: 11px;
            border-radius: 7px;
        }
        .links { text-align: center; margin-top: 22px; }
        a { color: #0c7a96; font-weight: bold; text-decoration: none; }
        .brand { text-align: center; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <h1>CareerIQ</h1>
            <p>Administrator Login</p>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>Admin Username</label>
            <input type="text" name="username" placeholder="Enter admin username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter admin password" required>

            <button type="submit">Login as Admin</button>
        </form>

        <div class="links">
            <a href="{{ url_for('login') }}">Back to Student Login</a>
        </div>
    </div>
</body>
</html>
